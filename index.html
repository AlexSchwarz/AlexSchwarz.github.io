<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Karten-Prototyp für die Lange Nacht der Zürcher Museen 2026."
    />
    <title>Museumsnacht Zürich – Karten-Prototyp</title>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link rel="stylesheet" href="leaflet-local.css" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="map-frame" aria-label="Interaktive Karte mit 52 Museen">
        <div id="map"></div>

        <aside id="museum-list" class="museum-list" aria-label="Museen im Prototyp">
          <div class="list-heading">
            <div>
              <h1>Orte für heute</h1>
              <p id="location-summary">Museen werden geladen …</p>
            </div>
            <div class="list-controls">
              <button id="fit-map" type="button">Alle zeigen</button>
              <button id="hide-list" type="button" aria-label="Museumsliste einklappen" title="Museumsliste einklappen">‹</button>
            </div>
          </div>
          <label class="museum-search">
            <span class="visually-hidden">Museen suchen</span>
            <input id="museum-search" type="search" placeholder="Museum suchen" autocomplete="off" />
          </label>
          <div id="museum-cards" aria-live="polite">
            <p class="list-status">Museen werden geladen …</p>
          </div>
        </aside>

        <button id="show-list" class="show-list" type="button" aria-controls="museum-list" aria-expanded="false" hidden>
          Museen
        </button>

        <aside id="museum-detail" class="detail-panel" aria-label="Museumdetails" hidden>
          <div id="museum-detail-content"></div>
        </aside>
      </section>
    </main>

    <noscript>Diese Karte benötigt JavaScript.</noscript>
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="app.js"></script>
  </body>
</html>
